[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-agent-email"
version = "0.1.0"
description = "Dependency-free Python client for Open Agent Email"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Open Agent Email contributors" }]

[tool.setuptools.packages.find]
where = ["."]
