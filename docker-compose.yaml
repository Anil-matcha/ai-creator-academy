services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "2525:2525"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - SMTP_HOST=0.0.0.0
      - SMTP_PORT=2525
      - DATABASE_URL=sqlite+aiosqlite:///./open_agent_email.db
      - SHARED_DOMAIN=agents.local
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - ADMIN_API_KEY=${ADMIN_API_KEY:?Set ADMIN_API_KEY before starting the stack}
      - SMTP_CONFIG_ENCRYPTION_KEY=${SMTP_CONFIG_ENCRYPTION_KEY:-}
      - SMTP_CONFIG_ENCRYPTION_KEY_PREVIOUS=${SMTP_CONFIG_ENCRYPTION_KEY_PREVIOUS:-}
      - WEBHOOK_DELIVERY_RETENTION_DAYS=${WEBHOOK_DELIVERY_RETENTION_DAYS:-30}
    volumes:
      - ./server/open_agent_email.db:/app/open_agent_email.db

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://server:8000
    depends_on:
      - server

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI
